services:
  - type: web
    name: mern-clothing-store
    env: node
    plan: free
    rootDir: .
    buildCommand: |
      npm install
      npm --prefix client install
      npm --prefix client run build
      npm --prefix server install
    startCommand: npm --prefix server start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://your-render-frontend-url.example.com
